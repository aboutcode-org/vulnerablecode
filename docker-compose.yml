name: vulnerablecode

x-app-volume: &app-volume /etc/vulnerablecode/:/etc/vulnerablecode/

x-app-common: &app-common
  image: vulnerablecode:${VULNERABLECODE_VERSION:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - docker.env
  volumes:
    - *app-volume

services:
  db:
    image: postgres:15
    command: -c config_file=/etc/postgresql/postgresql.conf
    env_file:
      - docker.env
    volumes:
      - db_data:/var/lib/postgresql/data/
      - ./etc/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
    shm_size: 1gb
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vulnerablecode_redis:
    image: docker.io/library/redis:8.10.3-alpine
    volumes:
      - vulnerablecode_redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vulnerablecode:
    <<: *app-common
    command: /bin/sh -c "
        ./manage.py migrate &&
        ./manage.py collectstatic --no-input --verbosity 0 --clear &&
        gunicorn vulnerablecode.wsgi:application -u nobody -g nogroup --bind :8000 --timeout 600 --workers 8"
    expose:
      - 8000
    volumes:
      - *app-volume
      - static:/var/vulnerablecode/static/
    restart: always
    depends_on:
      db:
        condition: service_healthy

  vulnerablecode_scheduler:
    <<: *app-common
    command: wait-for-it web:8000 -- python ./manage.py run_scheduler
    depends_on:
      db:
        condition: service_healthy
      vulnerablecode:
        condition: service_started
      vulnerablecode_redis:
        condition: service_healthy

  vulnerablecode_rqworker:
    <<: *app-common
    command: wait-for-it web:8000 -- python ./manage.py rqworker default
    depends_on:
      db:
        condition: service_healthy
      vulnerablecode:
        condition: service_started
      vulnerablecode_redis:
        condition: service_healthy

  vulnerablecode_rqworker_high:
    <<: *app-common
    command: wait-for-it web:8000 -- python ./manage.py rqworker high
    depends_on:
      db:
        condition: service_healthy
      vulnerablecode:
        condition: service_started
      vulnerablecode_redis:
        condition: service_healthy

  nginx:
    image: docker.io/library/nginx:1.31.9-alpine
    ports:
      - 80:80
      - 443:443
    env_file:
      - docker.env
    volumes:
      - ./etc/nginx/conf.d/:/etc/nginx/conf.d/
      - static:/var/vulnerablecode/static/
      - /var/www/html:/var/www/html
    restart: always
    depends_on:
      vulnerablecode:
        condition: service_started


volumes:
  db_data:
  static:
  vulnerablecode_redis_data:

