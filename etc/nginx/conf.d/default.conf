upstream gunicorn_app {
    server vulnerablecode:8000;
}

# Add the immediate TLS proxy addresses allowed to supply X-Forwarded-Proto.
# The outer proxy must overwrite any client-supplied value of this header.
geo $vcio_trusted_proxy {
    default 0;
    # Example: replace with the proxy address as seen by this Nginx instance.
    # 192.0.2.10/32 1;
}

map "$vcio_trusted_proxy:$http_x_forwarded_proto" $vcio_forwarded_proto {
    default $scheme;
    "1:http" http;
    "1:https" https;
}

server {
    listen 80;

    location / {
        proxy_pass http://gunicorn_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        client_max_body_size 10G;
        proxy_read_timeout 600s;
        proxy_set_header X-Forwarded-Proto $vcio_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /static/ {
        alias /var/vulnerablecode/static/;
    }
}
